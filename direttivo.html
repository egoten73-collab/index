<style>
:root{--blu:#0a1628;--blu2:#132040;--oro:#c9a84c;--oro2:#e8c97a;--tx:#f5f0e8;--mut:rgba(245,240,232,.6);--br:rgba(201,168,76,.25);
  --card:rgba(10,22,40,.6);--ok:#7fc8a0;--warn:#f0c27a;--err:#ef9a8a;--chip:rgba(10,22,40,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--blu);color:var(--tx);font:16px/1.45 'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}

/* sfondo come la pagina Pagamenti */
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 80% 60% at 15% 85%,rgba(201,168,76,.10) 0%,transparent 55%),
  radial-gradient(ellipse 70% 70% at 85% 15%,rgba(19,32,64,.95) 0%,transparent 65%),
  linear-gradient(160deg,#0a1628 0%,#0d1f3c 50%,#071020 100%)}
.onde{position:fixed;bottom:0;left:0;right:0;height:180px;z-index:0;opacity:.5;pointer-events:none}
.particle{position:fixed;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(201,168,76,.6),transparent);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.3}100%{transform:translateY(-20vh) scale(1);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 8px rgba(201,168,76,.06),0 0 60px rgba(201,168,76,.20)}50%{box-shadow:0 0 0 14px rgba(201,168,76,.10),0 0 90px rgba(201,168,76,.35)}}

/* intestazione */
header{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:34px 16px 6px;text-align:center}
.emblema{width:132px;height:132px;border-radius:50%;border:2px solid rgba(201,168,76,.6);background:#fff;overflow:hidden;animation:pulseGlow 3s ease-in-out infinite;margin-bottom:20px}
.emblema img{width:100%;height:100%;object-fit:cover;display:block}
header h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:27px;color:var(--oro2);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;animation:fadeUp .8s ease .2s both}
.sottotitolo{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(201,168,76,.65);animation:fadeUp .8s ease .35s both}
.divisore{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent);margin:22px auto 4px}
#btnImpost{position:absolute;top:14px;right:14px;width:40px;height:40px;padding:0;border-radius:50%;background:rgba(10,22,40,.5);border:1px solid var(--br);color:rgba(201,168,76,.6);font-size:18px}

main{position:relative;z-index:10;max-width:520px;margin:0 auto;padding:16px 16px 8px}
.card{background:linear-gradient(160deg,rgba(26,58,107,.55),rgba(13,35,71,.65));border:1px solid rgba(201,168,76,.28);border-radius:20px;padding:20px 16px;margin-bottom:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(201,168,76,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeUp .5s ease both}
.card h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:23px;letter-spacing:.04em;color:var(--oro2);margin:0 0 12px}
.card p{margin:0 0 10px}
.card strong{color:var(--oro2);font-weight:500}
label{display:block;font-size:12px;letter-spacing:.06em;color:rgba(201,168,76,.75);margin:14px 0 6px}
input[type=text],input[type=date],input[type=password],input[type=url],input[type=search],input:not([type]),select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:rgba(10,22,40,.65);border:1px solid var(--br);border-radius:12px;padding:13px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
input::placeholder,textarea::placeholder{color:rgba(245,240,232,.35)}
input[type=date]{color-scheme:dark;min-height:50px}
select{appearance:none;-webkit-appearance:none;padding-right:40px;
  background-image:linear-gradient(45deg,transparent 50%,var(--oro) 50%),linear-gradient(135deg,var(--oro) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select option{background:var(--blu2);color:var(--tx)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--oro);flex:none}
textarea{min-height:70px;resize:vertical}
button{font:inherit;border-radius:12px;border:1px solid var(--br);background:rgba(10,22,40,.55);color:var(--tx);padding:11px 14px;cursor:pointer;transition:transform .15s,opacity .2s,background .2s}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,#1a3a6b 0%,#0d2347 100%);border-color:rgba(201,168,76,.5);color:var(--oro2);font-weight:500;letter-spacing:.06em;
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(201,168,76,.15)}
button.big{width:100%;padding:17px;font-size:15px;margin-bottom:10px;border-radius:16px}
button.pri.big{text-transform:uppercase;letter-spacing:.08em}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--chip);border:1px solid var(--br);border-radius:12px;padding:8px 12px;font-size:14px}
.chip.on{background:linear-gradient(135deg,rgba(201,168,76,.28),rgba(201,168,76,.10));color:var(--oro2);border-color:var(--oro)}
.msg{padding:11px 13px;border-radius:12px;margin:10px 0;font-size:14px;border:1px solid var(--br);background:rgba(10,22,40,.4)}
.msg.warn{color:var(--warn);border-color:rgba(240,194,122,.45);background:rgba(240,194,122,.06)}
.msg.err{color:var(--err);border-color:rgba(239,154,138,.5);background:rgba(239,154,138,.07)}
.msg.ok{color:var(--ok);border-color:rgba(127,200,160,.45);background:rgba(127,200,160,.06)}
.voce{border:1px solid rgba(201,168,76,.18);background:rgba(10,22,40,.4);border-radius:14px;padding:4px 12px 12px;margin-top:12px}
.voce > input[type=text]{margin-top:10px}
.mut{color:var(--mut);font-size:13px}
.hide{display:none!important}
.mesi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mesi button{padding:10px 0;font-size:14px;text-transform:capitalize}
.mesi button.on{background:linear-gradient(135deg,rgba(201,168,76,.28),rgba(201,168,76,.10));color:var(--oro2);border-color:var(--oro)}
.anno{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px;color:var(--oro2)}
.anno button{width:34px;height:34px;padding:0;border-radius:50%;color:var(--oro2)}
img.anteprima{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:10px auto;border:1px solid var(--br)}
details{margin-top:8px}
pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;background:var(--chip);padding:8px;border-radius:8px;max-height:220px;overflow:auto}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(201,168,76,.35);border-top-color:var(--oro2);border-radius:50%;animation:r 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.cerchio-ok{width:84px;height:84px;margin:6px auto 16px;border-radius:50%;border:2px solid var(--oro);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(201,168,76,.3)}
.cerchio-ok svg{width:40px;height:40px}
.cerchio-ok path{stroke:var(--oro2);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:traccia .6s ease .2s forwards}
@keyframes traccia{to{stroke-dashoffset:0}}
.successo{text-align:center}
.badge{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(201,168,76,.45)}
.badge-dot{width:5px;height:5px;border-radius:50%;background:rgba(201,168,76,.4)}
.istruzioni{position:relative;z-index:10;max-width:520px;margin:0 auto;padding:0 16px 30px;text-align:center;font-size:11px;color:rgba(201,168,76,.4);letter-spacing:.05em;line-height:1.6}
.istruzioni strong{color:rgba(201,168,76,.6);font-weight:500}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 14px;margin-bottom:10px;border-radius:16px}
.menu-ico{font-size:28px;line-height:1}
.menu-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.menu-txt strong{color:var(--oro2);font-weight:500;font-size:17px}
.menu-txt small{color:var(--mut);font-size:13px}
.menu-freccia{color:var(--oro);font-size:26px;line-height:1}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 8px;border-radius:16px}
.tipo-ico{font-size:38px;line-height:1}
.tipo strong{color:var(--oro2);font-weight:500;font-size:15px}
.tipo small{color:var(--mut);font-size:12px}
.link-indietro{background:none;border:none;color:var(--oro);padding:2px 2px 12px;font-size:15px;box-shadow:none}
.val-wrap{position:relative}
input.val{font-size:30px;letter-spacing:.08em;text-align:center;padding:14px 64px;font-variant-numeric:tabular-nums}
.val-unita{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--oro);font-size:16px}
.ritaglio{margin:6px 0 4px}
.grande{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--oro2);margin:0 0 10px}
table.sit{width:100%;border-collapse:collapse;font-size:15px}
table.sit td{padding:9px 2px;border-bottom:1px solid var(--br)}
table.sit td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.sit tr.tot td{font-weight:600;color:var(--oro2);border-bottom:none;font-size:17px;padding-top:12px}
.stato{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--br);color:var(--mut)}
.stato.ok{background:rgba(127,200,160,.12);color:var(--ok);border-color:rgba(127,200,160,.4)}
.stato.warn{background:rgba(240,194,122,.10);color:var(--warn);border-color:rgba(240,194,122,.4)}
.stato.err{background:rgba(239,154,138,.12);color:var(--err);border-color:rgba(239,154,138,.45)}
.mesi-q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mq{border:1px solid var(--br);border-radius:10px;padding:7px 2px;text-align:center;font-size:12px;color:var(--mut);text-transform:capitalize}
.mq b{display:block;font-size:14px;color:var(--tx);font-weight:500;margin-top:2px}
.mq.pag{border-color:rgba(127,200,160,.5);background:rgba(127,200,160,.06)}
.mq.pag b{color:var(--ok)}
.lista{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:62vh;overflow:auto;padding-right:2px}
.riga-int{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;border-radius:12px}
.riga-int.fatto{border-color:rgba(127,200,160,.5);background:rgba(127,200,160,.06)}
.riga-int.prossimo{border-color:var(--oro)}
.ri-num{min-width:44px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,.12);color:var(--oro2);font-weight:600}
.ri-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.ri-txt strong{font-weight:500;font-size:14px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-txt small{font-size:12px;color:var(--mut)}
.ri-stato{color:var(--oro);font-size:20px}
.riga-int.fatto .ri-stato{color:var(--ok)}
.link-foto{display:inline-block;color:var(--oro2);margin:2px 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;background:#0e1d38;border:1px solid var(--oro);color:var(--tx);padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw;font-size:14px;transition:opacity .5s}
.toast.via{opacity:0}
.riga-int.meta{border-color:rgba(240,194,122,.45)}
.ri-txt small{display:block}
.pannello{padding:16px 14px}
.pan-testa{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pan-testa h3{margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:21px;color:var(--oro2)}
.ok-badge{white-space:nowrap;font-size:12px;color:var(--ok);border:1px solid rgba(127,200,160,.45);background:rgba(127,200,160,.08);border-radius:999px;padding:3px 10px}
.testata{padding:14px 16px}
.voce-lista{border-top:1px solid var(--br);padding:10px 0}
.voce-lista:first-of-type{border-top:none}
.vl-testa{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vl-testa strong{font-weight:500;font-size:15px}
.vl-importo{color:var(--oro2);white-space:nowrap;font-variant-numeric:tabular-nums}
button.piccolo{padding:6px 12px;font-size:13px;border-radius:10px}
.riga2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.riga-sit{border:1px solid var(--br);border-radius:12px;padding:10px 12px;background:rgba(10,22,40,.4)}
.rs-testa{display:flex;align-items:center;gap:10px}
.rs-testa strong{flex:1;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-tot{color:var(--err);font-weight:600;white-space:nowrap}
.rs-cifre{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cifra{font-size:12px;color:var(--mut);border:1px solid var(--br);border-radius:999px;padding:3px 9px}
.cifra b{font-weight:500;color:var(--ok)}
.cifra.deve b{color:var(--err)}
.cifra.credito b{color:var(--ok)}
.chip.on{border-color:var(--oro);color:var(--oro2)}
.riga2>div{min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.scelta{display:inline-flex!important;align-items:center;gap:8px;margin:4px 18px 4px 0!important;text-transform:none!important;letter-spacing:0!important;font-size:15px!important;color:inherit!important}
.scelta input{width:auto!important;margin:0}

</style>
</head>

/* Lettura dei dati principali dal testo di una bolletta Enel (luce) o Abbanoa (acqua). */
(function (root) {
  'use strict';
  function num(s) { return s == null ? null : Number(String(s).replace(/\./g, '').replace(',', '.')); }
  function iso(g, m, a) { return a + '-' + ('0' + m).slice(-2) + '-' + ('0' + g).slice(-2); }
  var MESI = { GEN: 1, FEB: 2, MAR: 3, APR: 4, MAG: 5, GIU: 6, LUG: 7, AGO: 8, SET: 9, OTT: 10, NOV: 11, DIC: 12 };

  function enel(t) {
    var r = { tipo: 'luce', fornitore: 'Enel' }, m;
    if ((m = /fattura elettronica n\.?\s*(\d+)\s+del\s+(\d\d)\/(\d\d)\/(\d{4})/i.exec(t))) { r.numero = m[1]; r.emessa = iso(+m[2], +m[3], +m[4]); }
    if ((m = /TOTALE BOLLETTA\s+([\d.]+,\d{2})\s*€/i.exec(t))) r.importo = num(m[1]);
    if ((m = /Accisa sull'energia elettrica[\s\S]{0,60}?su kWh\s*([\d.]+)/i.exec(t))) r.consumo = num(m[1]);
    else if ((m = /Quota consumi\s+([\d.]+)\s*kWh/i.exec(t))) r.consumo = num(m[1]);
    if ((m = /Consumo fatturato\s*\(dal\s+(\d\d)\.(\d\d)\.(\d{4})\s+al\s+(\d\d)\.(\d\d)\.(\d{4})\)/i.exec(t))) {
      r.dal = iso(+m[1], +m[2], +m[3]); r.al = iso(+m[4], +m[5], +m[6]);
    } else if ((m = /Periodo\s+([A-Z]{3})[A-Z]*\.?\s+(\d{4})/.exec(t)) && MESI[m[1]]) {
      var mm = MESI[m[1]], aa = +m[2], ult = new Date(aa, mm, 0).getDate();
      r.dal = iso(1, mm, aa); r.al = iso(ult, mm, aa);
    }
    r.note = 'Enel fatt. ' + (r.numero || '');
    return r;
  }

  function abbanoa(t) {
    var r = { tipo: 'acqua', fornitore: 'Abbanoa' }, m;
    if ((m = /Fattura num\.\s*(\d+)\s+del\s+(\d\d)\/(\d\d)\/(\d{4})/i.exec(t))) { r.numero = m[1]; r.emessa = iso(+m[2], +m[3], +m[4]); }
    if ((m = /periodo\s+dal\s+(\d\d)\/(\d\d)\/(\d{4})\s+al\s+(\d\d)\/(\d\d)\/(\d{4})\s+è di[\s\S]{0,300}?mc\.?\s*([\d.]+)/i.exec(t))) {
      r.dal = iso(+m[1], +m[2], +m[3]); r.al = iso(+m[4], +m[5], +m[6]); r.consumo = num(m[7]);
    } else if ((m = /Consumo fatturato\s+([\d.]+)\s*mc/i.exec(t))) r.consumo = num(m[1]);

  // ---------------------------------------------------------------- giro letture (acqua e luce insieme)
  var COSTANTE = 25;   // contatore generale della luce: numero sul display x 25 = kWh (aggiornata dallo script)

  function vistaGiro(ricarica) {

  function fatto(x, tipo) { return !!(x[tipo] && x[tipo].oggi); }
  function completo(x) { return fatto(x, 'acqua') && fatto(x, 'luce'); }
  function testoUltima(x, tipo) {
    var u = x[tipo];
    return (tipo === 'acqua' ? '💧 ' : '⚡ ') + (u ? numIt(u.valore) + ' ' + UNITA[tipo] + ' · ' + u.data : 'nessuna') + (fatto(x, tipo) ? ' ✓' : '');
  }

  function disegnaGiro(evidenzia) {
    svuota(app);
    app.appendChild(indietro(vistaMenu));
    var L = elenco.elenco;
    var nA = L.filter(function (x) { return fatto(x, 'acqua'); }).length, nL = L.filter(function (x) { return fatto(x, 'luce'); }).length;
    var cerca = h('input', { type: 'search', placeholder: 'Cerca interno o nome', value: filtro });
    var lista = h('div', { class: 'lista' });
    function riempi() {
      svuota(lista);
      var q = filtro.trim().toUpperCase();
      L.filter(function (x) { return !q || x.interno === q || String(x.socio).toUpperCase().indexOf(q) >= 0; }).forEach(function (x) {
        var cls = 'riga-int' + (completo(x) ? ' fatto' : (fatto(x, 'acqua') || fatto(x, 'luce')) ? ' meta' : '') + (x.interno === evidenzia ? ' prossimo' : '');
        var el = h('button', { type: 'button', class: cls, onclick: function () { vistaInterno(x); } }, [
          h('span', { class: 'ri-num', text: x.interno }),
          h('span', { class: 'ri-txt' }, [h('strong', { text: x.socio }),
            h('small', { text: testoUltima(x, 'acqua') }), h('small', { text: testoUltima(x, 'luce') })]),
          h('span', { class: 'ri-stato', text: completo(x) ? '✓' : '›' })
        ]);
        lista.appendChild(el);
        if (x.interno === evidenzia) setTimeout(function () { el.scrollIntoView({ block: 'center' }); }, 30);
      });
    }
    cerca.addEventListener('input', function () { filtro = cerca.value; riempi(); });
    app.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: 'Giro letture' }),
      h('p', { class: 'mut', text: 'Letti oggi: 💧 ' + nA + ' · ⚡ ' + nL + ' su ' + L.length + ' (contatori generali compresi). Tocca un interno: nella sua scheda trovi acqua e luce.' }),
      cerca, lista
    ]));
    riempi();
  }

  function prossimo(interno) {
    var L = elenco.elenco, i = L.findIndex(function (x) { return x.interno === interno; });
    for (var k = i + 1; k < L.length; k++) if (!completo(L[k])) return L[k];
    return null;
  }

  function vistaInterno(x) {

      onclick: function () { if (nx) vistaInterno(nx); else disegnaGiro(x.interno); } }));
    app.appendChild(h('button', { class: 'big', type: 'button', text: 'Torna all\'elenco', onclick: function () { disegnaGiro(x.interno); } }));

  /** Riquadro di una lettura (acqua o luce) dentro la scheda dell'interno: ha foto, numeri e salvataggio propri. */
  function pannello(x, tipo) {
    var gen = x.interno === 'GEN', perCostante = gen && tipo === 'luce';
    var box = h('div', { class: 'card pannello' });
    var titolo = (tipo === 'acqua' ? '💧 Acqua' : '⚡ Luce') + (gen ? (tipo === 'acqua' ? ' – contatore Abbanoa' : ' – contatore Enel') : '');
    var ultima = x[tipo] ? 'Ultima: ' + numIt(x[tipo].valore) + ' ' + UNITA[tipo] + ' del ' + x[tipo].data : 'Nessuna lettura precedente';

    function riepilogo(testo) {
      svuota(box);
      box.appendChild(h('div', { class: 'pan-testa' }, [h('h3', { text: titolo }), h('span', { class: 'ok-badge', text: '✓ letta oggi' })]));

    }

    function modulo(foto) {
      svuota(box);
      box.appendChild(h('div', { class: 'pan-testa' }, [h('h3', { text: titolo })]));
      box.appendChild(h('p', { class: 'mut', style: 'margin:2px 0 10px', text: ultima }));
      var fCam = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'hide', onchange: function () { if (fCam.files[0]) carica(fCam.files[0]); } });
      var fGal = h('input', { type: 'file', accept: 'image/*', class: 'hide', onchange: function () { if (fGal.files[0]) carica(fGal.files[0]); } });
      function carica(file) {
        svuota(box); box.appendChild(h('p', { style: 'margin:0' }, [h('span', { class: 'spin' }), 'Preparo la foto…']));
        window.Contatori.caricaFoto(file).then(modulo).catch(function (e) { modulo(null); alert(e.message); });
      }
      var inp = h('input', { type: 'text', inputmode: 'decimal', class: 'val', placeholder: '0', autocomplete: 'off' });
      var calc = h('p', { class: 'mut', style: 'margin:6px 0 0' });
      var alt = h('div', { class: 'chips' }), stato = h('p', { class: 'mut' }), esito = h('div'), rit = null, letto = '';
      if (foto) {
        var rq = h('div', { class: 'ritaglio' });
        box.appendChild(h('p', { class: 'mut', style: 'margin:0 0 6px', text: 'Trascina il dito sulla foto per riquadrare solo i numeri.' }));
        box.appendChild(rq);
        rit = window.Contatori.Ritaglio(rq, foto.canvas, leggiOra);
        box.appendChild(h('div', { class: 'row', style: 'margin-top:8px' }, [
          h('button', { type: 'button', text: '🔍 Rileggi', onclick: leggiOra }),
          h('button', { type: 'button', text: '📷 Altra foto', onclick: function () { fCam.click(); } })
        ]));
        box.appendChild(stato);
      } else {
        box.appendChild(h('div', { class: 'row' }, [
          h('button', { class: 'pri', type: 'button', style: 'flex:1', text: '📷 Fotografa', onclick: function () { fCam.click(); } }),
          h('button', { type: 'button', style: 'flex:1', text: '🖼 Galleria', onclick: function () { fGal.click(); } })
        ]));
      }
      box.appendChild(fCam); box.appendChild(fGal);
      box.appendChild(h('label', { text: perCostante ? 'Numero sul display (verrà moltiplicato × ' + COSTANTE + ')' : 'Lettura (' + UNITA[tipo] + ')' }));
      box.appendChild(h('div', { class: 'val-wrap' }, [inp, h('span', { class: 'val-unita', text: perCostante ? '× ' + COSTANTE : UNITA[tipo] })]));
      if (perCostante) box.appendChild(calc);
      box.appendChild(alt);
      var btn = h('button', { class: 'pri big', type: 'button', style: 'margin-top:10px', text: 'Salva ' + (tipo === 'acqua' ? 'acqua' : 'luce'), onclick: function () { salva(false); } });
      box.appendChild(esito); box.appendChild(btn);
      function aggiornaCalc() {
        if (!perCostante) return;
        var v = Number(String(inp.value).replace(',', '.'));
        calc.textContent = isFinite(v) && v > 0 ? '= ' + numIt(v * COSTANTE) + ' kWh' : '';
      }
      inp.addEventListener('input', aggiornaCalc);
      if (foto) setTimeout(leggiOra, 80);

      function scriviStato(t, gira) { svuota(stato); if (gira) stato.appendChild(h('span', { class: 'spin' })); stato.appendChild(document.createTextNode(t)); }
      function leggiOra() {
        if (!rit) return;
        scriviStato('Leggo i numeri…', true);
        window.Contatori.leggi(foto.canvas, rit.riquadro(), tipo, function (t) { scriviStato(t, true); }).then(function (r) {
          svuota(alt);
          if (r.migliore) { inp.value = r.migliore; letto = r.migliore; aggiornaCalc(); scriviStato('Numeri letti: controllali.'); }
          else scriviStato('Numeri non leggibili: riquadra meglio o scrivi a mano.');
          r.alternative.forEach(function (a) { alt.appendChild(h('button', { type: 'button', class: 'chip', text: 'Oppure ' + a + '?', onclick: function () { inp.value = a; aggiornaCalc(); } })); });
        }).catch(function () { scriviStato('Lettura automatica non disponibile: scrivi il numero.'); });
      }
      function salva(forza) {
        svuota(esito);
        var v = String(inp.value).trim().replace(/\s/g, '').replace(',', '.');
        if (!/^\d+(\.\d{1,3})?$/.test(v)) { esito.appendChild(msg('err', 'Scrivi la lettura con le sole cifre.')); return; }
        var valore = perCostante ? String(Math.round(Number(v) * COSTANTE * 100) / 100) : v;
        btn.disabled = true; btn.textContent = 'Salvataggio…';
        chiama({ azione: 'lettura', interno: x.interno, tipo: tipo, valore: valore, forza: forza, ocr: !!letto && inp.value === letto,
          foto_base64: foto ? foto.base64 : '', foto_mime: foto ? foto.mime : '', foto_nome: 'contatore.jpg' }).then(function (j) {
          btn.disabled = false; btn.textContent = 'Salva ' + (tipo === 'acqua' ? 'acqua' : 'luce');
          if (!j.ok) {
            esito.appendChild(msg('err', j.errore || 'Errore'));

            return;
          }
          x[tipo] = { valore: j.valore, data: new Date().toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }), oggi: true };
          riepilogo(numIt(j.valore) + ' ' + j.unita + (perCostante ? ' (' + v + ' × ' + COSTANTE + ')' : '') +
            (j.consumo !== undefined ? ' · consumo ' + numIt(j.consumo) + ' ' + j.unita + ' ≈ € ' + numIt(j.stima, 2) + (j.insolita ? ' – consumo alto, verifica!' : '') : ' · prima lettura'));
          toast('✓ ' + (x.interno === 'GEN' ? 'Generale' : 'Int. ' + x.interno) + ': ' + (tipo === 'acqua' ? 'acqua' : 'luce') + ' salvata');
        }).catch(function (e) { btn.disabled = false; btn.textContent = 'Salva ' + (tipo === 'acqua' ? 'acqua' : 'luce'); esito.appendChild(msg('err', e.message)); });
      }
    }

    if (fatto(x, tipo)) riepilogo(numIt(x[tipo].valore) + ' ' + UNITA[tipo] + ' · ' + x[tipo].data); else modulo(null);
    return box;
  }

  // ================================================================ file (PDF o foto) -> base64
  var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  function caricaScript(url) {
    return new Promise(function (ok, ko) {
      var s = document.createElement('script'); s.src = url; s.onload = ok;
      s.onerror = function () { ko(new Error('Lettore PDF non disponibile (serve internet).')); }; document.head.appendChild(s);
    });
  }
  function leggiFile(file) {
    var pdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if (!pdf) return window.Contatori.caricaFoto(file).then(function (f) { return { base64: f.base64, mime: 'image/jpeg', nome: (file.name || 'ricevuta').replace(/\.[^.]+$/, '') + '.jpg', pdf: false }; });
    return new Promise(function (ok, ko) {
      var fr = new FileReader();
      fr.onload = function () { ok({ base64: String(fr.result).split(',')[1], mime: 'application/pdf', nome: file.name || 'documento.pdf', pdf: true }); };
      fr.onerror = function () { ko(new Error('File non leggibile.')); };
      fr.readAsDataURL(file);
    });
  }
  /** Testo di un PDF, riga per riga (come appare sulla pagina). */
  function testoPdf(file) {
    return (window.pdfjsLib ? Promise.resolve() : caricaScript(PDFJS_URL)).then(function () {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      return file.arrayBuffer();
    }).then(function (buf) { return window.pdfjsLib.getDocument({ data: buf }).promise; }).then(function (doc) {
      var testo = '', p = Promise.resolve();
      for (var i = 1; i <= Math.min(doc.numPages, 8); i++) (function (n) {
        p = p.then(function () { return doc.getPage(n); }).then(function (pg) { return pg.getTextContent(); }).then(function (tc) {
          var righe = {};
          tc.items.forEach(function (it) { var y = Math.round(it.transform[5] / 3) * 3; (righe[y] = righe[y] || []).push(it); });
          Object.keys(righe).map(Number).sort(function (a, b) { return b - a; }).forEach(function (y) {
            testo += righe[y].sort(function (a, b) { return a.transform[4] - b.transform[4]; }).map(function (it) { return it.str; }).join('  ') + '\n';
          });
        });
      })(i);
      return p.then(function () { return testo; });
    });
  }
  function euro(n) { return '€ ' + numIt(n, 2); }
  function oggiIso() { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

  // ================================================================ bollette e prezzi

        ])

      var lista = h('div', { class: 'card' }, [h('h2', { text: 'Bollette inserite' }),
        j.daPagare > 0.005 ? msg('warn', 'Bollette da pagare: ' + euro(j.daPagare)) : null]);
      j.bollette.forEach(function (b) {

        }

        var r = h('div', { class: 'voce-lista' }, [

            } })
          ])
        ]);
        lista.appendChild(r);
      });
      app.appendChild(lista);
    }).catch(function (e) { svuota(app); app.appendChild(indietro(vistaMenu)); app.appendChild(h('div', { class: 'card' }, [msg('err', e.message)])); });
  }
  function euro4(n) { return '€ ' + Number(n || 0).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 4 }); }

  function vistaNuovaBolletta(tipo) {
    svuota(app); app.appendChild(indietro(vistaBollette));
    var unita = tipo === 'acqua' ? 'm³' : 'kWh', file = null;
    var titolo = h('h2', { text: tipo === 'acqua' ? '💧 Bolletta Abbanoa' : '⚡ Bolletta Enel' });

          h('p', { class: 'mut', text: 'Prezzi attuali: luce ' + euro4(j.prezzi.luce.prezzo) + '/kWh · acqua ' + euro4(j.prezzi.acqua.prezzo) + '/m³. Utenze dei soci ricalcolate e bolletta registrata tra le spese ordinarie.' }),

  // ================================================================ situazione di tutti i soci
  var ordineSit = 'totale';
  function vistaSituazioneSoci() {
    svuota(app); app.appendChild(caricamento('Calcolo la situazione dei soci…'));
