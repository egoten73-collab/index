<style>
:root{--blu:#0a1628;--blu2:#132040;--oro:#c9a84c;--oro2:#e8c97a;--tx:#f5f0e8;--mut:rgba(245,240,232,.6);--br:rgba(201,168,76,.25);
  --card:rgba(10,22,40,.6);--ok:#7fc8a0;--warn:#f0c27a;--err:#ef9a8a;--chip:rgba(10,22,40,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--blu);color:var(--tx);font:16px/1.45 'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}

/* sfondo come la pagina Pagamenti */
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 80% 60% at 15% 85%,rgba(201,168,76,.10) 0%,transparent 55%),
  radial-gradient(ellipse 70% 70% at 85% 15%,rgba(19,32,64,.95) 0%,transparent 65%),
  linear-gradient(160deg,#0a1628 0%,#0d1f3c 50%,#071020 100%)}
.onde{position:fixed;bottom:0;left:0;right:0;height:180px;z-index:0;opacity:.5;pointer-events:none}
.particle{position:fixed;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(circle,rgba(201,168,76,.6),transparent);animation:float linear infinite}
@keyframes float{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:.3}100%{transform:translateY(-20vh) scale(1);opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 8px rgba(201,168,76,.06),0 0 60px rgba(201,168,76,.20)}50%{box-shadow:0 0 0 14px rgba(201,168,76,.10),0 0 90px rgba(201,168,76,.35)}}

/* intestazione */
header{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;padding:34px 16px 6px;text-align:center}
.emblema{width:132px;height:132px;border-radius:50%;border:2px solid rgba(201,168,76,.6);background:#fff;overflow:hidden;animation:pulseGlow 3s ease-in-out infinite;margin-bottom:20px}
.emblema img{width:100%;height:100%;object-fit:cover;display:block}
header h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:27px;color:var(--oro2);letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;animation:fadeUp .8s ease .2s both}
.sottotitolo{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(201,168,76,.65);animation:fadeUp .8s ease .35s both}
.divisore{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent);margin:22px auto 4px}
#btnImpost{position:absolute;top:14px;right:14px;width:40px;height:40px;padding:0;border-radius:50%;background:rgba(10,22,40,.5);border:1px solid var(--br);color:rgba(201,168,76,.6);font-size:18px}

main{position:relative;z-index:10;max-width:520px;margin:0 auto;padding:16px 16px 8px}
.card{background:linear-gradient(160deg,rgba(26,58,107,.55),rgba(13,35,71,.65));border:1px solid rgba(201,168,76,.28);border-radius:20px;padding:20px 16px;margin-bottom:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(201,168,76,.15);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeUp .5s ease both}
.card h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:23px;letter-spacing:.04em;color:var(--oro2);margin:0 0 12px}
.card p{margin:0 0 10px}
.card strong{color:var(--oro2);font-weight:500}
label{display:block;font-size:12px;letter-spacing:.06em;color:rgba(201,168,76,.75);margin:14px 0 6px}
input[type=text],input[type=date],input[type=password],input[type=url],input[type=search],input:not([type]),select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:rgba(10,22,40,.65);border:1px solid var(--br);border-radius:12px;padding:13px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,168,76,.15)}
input::placeholder,textarea::placeholder{color:rgba(245,240,232,.35)}
input[type=date]{color-scheme:dark;min-height:50px}
select{appearance:none;-webkit-appearance:none;padding-right:40px;
  background-image:linear-gradient(45deg,transparent 50%,var(--oro) 50%),linear-gradient(135deg,var(--oro) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select option{background:var(--blu2);color:var(--tx)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--oro);flex:none}
textarea{min-height:70px;resize:vertical}
button{font:inherit;border-radius:12px;border:1px solid var(--br);background:rgba(10,22,40,.55);color:var(--tx);padding:11px 14px;cursor:pointer;transition:transform .15s,opacity .2s,background .2s}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,#1a3a6b 0%,#0d2347 100%);border-color:rgba(201,168,76,.5);color:var(--oro2);font-weight:500;letter-spacing:.06em;
  box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(201,168,76,.15)}
button.big{width:100%;padding:17px;font-size:15px;margin-bottom:10px;border-radius:16px}
button.pri.big{text-transform:uppercase;letter-spacing:.08em}
button:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--chip);border:1px solid var(--br);border-radius:12px;padding:8px 12px;font-size:14px}
.chip.on{background:linear-gradient(135deg,rgba(201,168,76,.28),rgba(201,168,76,.10));color:var(--oro2);border-color:var(--oro)}
.msg{padding:11px 13px;border-radius:12px;margin:10px 0;font-size:14px;border:1px solid var(--br);background:rgba(10,22,40,.4)}
.msg.warn{color:var(--warn);border-color:rgba(240,194,122,.45);background:rgba(240,194,122,.06)}
.msg.err{color:var(--err);border-color:rgba(239,154,138,.5);background:rgba(239,154,138,.07)}
.msg.ok{color:var(--ok);border-color:rgba(127,200,160,.45);background:rgba(127,200,160,.06)}
.voce{border:1px solid rgba(201,168,76,.18);background:rgba(10,22,40,.4);border-radius:14px;padding:4px 12px 12px;margin-top:12px}
.voce > input[type=text]{margin-top:10px}
.mut{color:var(--mut);font-size:13px}
.hide{display:none!important}
.mesi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mesi button{padding:10px 0;font-size:14px;text-transform:capitalize}
.mesi button.on{background:linear-gradient(135deg,rgba(201,168,76,.28),rgba(201,168,76,.10));color:var(--oro2);border-color:var(--oro)}
.anno{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px;color:var(--oro2)}
.anno button{width:34px;height:34px;padding:0;border-radius:50%;color:var(--oro2)}
img.anteprima{max-width:100%;max-height:260px;border-radius:12px;display:block;margin:10px auto;border:1px solid var(--br)}
details{margin-top:8px}
pre{white-space:pre-wrap;word-break:break-word;font-size:.8rem;background:var(--chip);padding:8px;border-radius:8px;max-height:220px;overflow:auto}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(201,168,76,.35);border-top-color:var(--oro2);border-radius:50%;animation:r 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
.cerchio-ok{width:84px;height:84px;margin:6px auto 16px;border-radius:50%;border:2px solid var(--oro);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(201,168,76,.3)}
.cerchio-ok svg{width:40px;height:40px}
.cerchio-ok path{stroke:var(--oro2);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:traccia .6s ease .2s forwards}
@keyframes traccia{to{stroke-dashoffset:0}}
.successo{text-align:center}
.badge{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(201,168,76,.45)}
.badge-dot{width:5px;height:5px;border-radius:50%;background:rgba(201,168,76,.4)}
.istruzioni{position:relative;z-index:10;max-width:520px;margin:0 auto;padding:0 16px 30px;text-align:center;font-size:11px;color:rgba(201,168,76,.4);letter-spacing:.05em;line-height:1.6}
.istruzioni strong{color:rgba(201,168,76,.6);font-weight:500}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 14px;margin-bottom:10px;border-radius:16px}
.menu-ico{font-size:28px;line-height:1}
.menu-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.menu-txt strong{color:var(--oro2);font-weight:500;font-size:17px}
.menu-txt small{color:var(--mut);font-size:13px}
.menu-freccia{color:var(--oro);font-size:26px;line-height:1}
.due{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tipo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 8px;border-radius:16px}
.tipo-ico{font-size:38px;line-height:1}
.tipo strong{color:var(--oro2);font-weight:500;font-size:15px}
.tipo small{color:var(--mut);font-size:12px}
.link-indietro{background:none;border:none;color:var(--oro);padding:2px 2px 12px;font-size:15px;box-shadow:none}
.val-wrap{position:relative}
input.val{font-size:30px;letter-spacing:.08em;text-align:center;padding:14px 64px;font-variant-numeric:tabular-nums}
.val-unita{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--oro);font-size:16px}
.ritaglio{margin:6px 0 4px}
.grande{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--oro2);margin:0 0 10px}
table.sit{width:100%;border-collapse:collapse;font-size:15px}
table.sit td{padding:9px 2px;border-bottom:1px solid var(--br)}
table.sit td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.sit tr.tot td{font-weight:600;color:var(--oro2);border-bottom:none;font-size:17px;padding-top:12px}
.stato{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--br);color:var(--mut)}
.stato.ok{background:rgba(127,200,160,.12);color:var(--ok);border-color:rgba(127,200,160,.4)}
.stato.warn{background:rgba(240,194,122,.10);color:var(--warn);border-color:rgba(240,194,122,.4)}
.stato.err{background:rgba(239,154,138,.12);color:var(--err);border-color:rgba(239,154,138,.45)}
.mesi-q{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mq{border:1px solid var(--br);border-radius:10px;padding:7px 2px;text-align:center;font-size:12px;color:var(--mut);text-transform:capitalize}
.mq b{display:block;font-size:14px;color:var(--tx);font-weight:500;margin-top:2px}
.mq.pag{border-color:rgba(127,200,160,.5);background:rgba(127,200,160,.06)}
.mq.pag b{color:var(--ok)}
</style>
</head>

<script id="contatori-js">
/* Lettura dei numeri dalla foto di un contatore (acqua o luce), tutto nel browser.
   - display a 7 segmenti (contatori della luce): decodifica propria dei segmenti;
   - rulli numerati (contatori dell'acqua): Tesseract, solo cifre;
   Il risultato e' sempre una proposta: la persona lo controlla e lo corregge. */
(function (root) {
  'use strict';
  var TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  var MAX_LATO = 1600;
  var worker = null, workerPromise = null;

  function caricaScript(url) {
    return new Promise(function (ok, ko) {
      if (root.Tesseract) return ok();
      var s = document.createElement('script');
      s.src = url; s.onload = ok; s.onerror = function () { ko(new Error('Lettore numeri non disponibile (serve internet).')); };
      document.head.appendChild(s);
    });
  }

  function getWorker(stato) {
    if (worker) return Promise.resolve(worker);
    if (workerPromise) return workerPromise;
    stato && stato('Preparo il lettore dei numeri (la prima volta qualche secondo)…');
    workerPromise = caricaScript(TESS_URL).then(function () {
      return root.Tesseract.createWorker('eng', 1);
    }).then(function (w) {
      return w.setParameters({ tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: '7' }).then(function () { worker = w; return w; });
    }).catch(function (e) { workerPromise = null; throw e; });
    return workerPromise;
  }

  // ------------------------------------------------------------ foto
  /** File immagine -> {canvas ridotto, base64 jpeg} */
  function caricaFoto(file) {
    return new Promise(function (ok, ko) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var s = Math.min(1, MAX_LATO / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var dataUrl = c.toDataURL('image/jpeg', 0.85);
        ok({ canvas: c, base64: dataUrl.split(',')[1], mime: 'image/jpeg' });
      };
      img.onerror = function () { ko(new Error('Immagine non leggibile.')); };
      img.src = url;
    });
  }

  // ------------------------------------------------------------ riquadro sui numeri
  /** Mostra la foto in un canvas dove si trascina il dito per riquadrare i numeri. */
  function Ritaglio(contenitore, src, onChange) {
    var vis = document.createElement('canvas');
    vis.style.width = '100%'; vis.style.touchAction = 'none'; vis.style.borderRadius = '12px'; vis.style.display = 'block';
    contenitore.appendChild(vis);
    var r = { x: 0.08, y: 0.36, w: 0.84, h: 0.28 };     // frazioni della foto
    var inizio = null;
    function disegna() {
      var W = contenitore.clientWidth || 320, k = W / src.width;
      vis.width = Math.round(W * (window.devicePixelRatio || 1)); vis.height = Math.round(src.height * k * (window.devicePixelRatio || 1));
      vis.style.height = Math.round(src.height * k) + 'px';
      var g = vis.getContext('2d');
      g.drawImage(src, 0, 0, vis.width, vis.height);
      g.fillStyle = 'rgba(0,0,0,0.5)';
      var x = r.x * vis.width, y = r.y * vis.height, w = r.w * vis.width, h = r.h * vis.height;
      g.fillRect(0, 0, vis.width, y); g.fillRect(0, y + h, vis.width, vis.height - y - h);
      g.fillRect(0, y, x, h); g.fillRect(x + w, y, vis.width - x - w, h);
      g.strokeStyle = '#e8c97a'; g.lineWidth = 3 * (window.devicePixelRatio || 1); g.strokeRect(x, y, w, h);
    }
    function pos(e) {
      var b = vis.getBoundingClientRect();
      return { x: Math.min(1, Math.max(0, (e.clientX - b.left) / b.width)), y: Math.min(1, Math.max(0, (e.clientY - b.top) / b.height)) };
    }
    vis.addEventListener('pointerdown', function (e) { vis.setPointerCapture(e.pointerId); inizio = pos(e); });
    vis.addEventListener('pointermove', function (e) {
      if (!inizio) return;
      var p = pos(e);
      if (Math.abs(p.x - inizio.x) < 0.03 && Math.abs(p.y - inizio.y) < 0.02) return;
      r = { x: Math.min(p.x, inizio.x), y: Math.min(p.y, inizio.y), w: Math.abs(p.x - inizio.x), h: Math.abs(p.y - inizio.y) };

      // anno: propagato all'indietro dal primo mese che ce l'ha

        if (g[x].anno) ultimo = g[x].anno;
        else if (ultimo) g[x].anno = ultimo;

  // ------------------------------------------------------------------ categorie
  function indovinaCategoria(testo) {
    var t = senzaAccenti(String(testo)).toLowerCase();
    if (/arretrat|pregress|morosit/.test(t)) return 'Arretrati';
    // voci dei solleciti dell'amministratore (anni passati): stanno negli arretrati
    if (/depurator|messa\s*a\s*norma|osservanza|saldo\s*iniziale/.test(t) && !/\b20(2[6-9]|[3-9]\d)\b/.test(t)) return 'Arretrati';
    if (/spes[ae]\s*extra|\bextra\b|straordinar|lavori|manutenzion|una\s*tantum/.test(t)) return 'Spese extra';
    if (/utenz|\bacqua\b|\bluce\b|energia|\benel\b|\bgas\b|consum|bolletta|contator/.test(t)) return 'Utenze';
    if (/quota|ordinari|condomin|\brata\b|annuale|associativ|spese\s+general/.test(t)) return 'Quota ordinaria';

  function categoriaDaChunk(chunk) {

    var t = senzaAccenti(String(chunk)).toLowerCase();
    var isExtra = /spes[ae]\s*extra|\bextra\b|straordinar|lavori|manutenzion/.test(t);
    var isUtenze = /utenz|\bacqua\b|\bluce\b|energia|\benel\b|\bgas\b|consum|bolletta|contator/.test(t);

  // ------------------------------------------------------------------ voci multiple

    if (/quota|ordinari|mensilit|canone/.test(t) || (!vecchie && /\brata\b/.test(t))) out.push('Quota ordinaria');
    if (/utenz|\bacqua\b|\bluce\b|energia|\benel\b|\bgas\b|consum|bolletta|contator/.test(t)) out.push('Utenze');
    if (!vecchie && /spes[ae]\s*extra|\bextra\b|straordinar|lavori|manutenzion|una\s*tantum/.test(t)) out.push('Spese extra');

  function trovaVoci(causale, totale, annoDefault) {

      categoria: (function (c) { return c === 'Altro' && globali.length ? 'Quota ordinaria' : c; })(indovinaCategoria(causale)), importo: totale, mesi: globali,
      acconto: haAcconto(causale), note: ''

    var citate = categorieCitate(causale || '');

      return citate.map(function (c) {
        return { categoria: c, importo: null, mesi: c === 'Quota ordinaria' ? globali : [], acconto: c === 'Quota ordinaria' && haAcconto(causale), note: '', daDividere: true };

    if (!causale || !totale) return citate.length > 1 ? miste() : [base];

    var pezzi = causale.split(/\s*(?:\+|;|\n|\s&\s|\se\s)\s*/i).filter(function (x) { return x.trim(); });

      var ha = trovaImporti(p).candidati.length > 0 && /(€|eur|\d[,.]\d{2})/i.test(p);
      if (ha) { chunks.push((pendente + ' ' + p).trim()); pendente = ''; } else pendente += ' ' + p;
    });
    if (chunks.length < 2) return citate.length > 1 ? miste() : [base];
    var voci = chunks.map(function (c) {

        .replace(/\b(?:19|20)\d{2}\b(?!\s*[,.]\d)/g, ' ');

  // ------------------------------------------------------------------ soci
  function internoList(s) {

  }

  function normNome(s) {

    if (!soci || !soci.length) { res.avvisi.push('Elenco soci non disponibile: scrivi nome e interno a mano.'); return res; }

    // 1) per interno

      soci.forEach(function (s) {
        var li = internoList(s.interno);

      });
      if (trovati.length === 1) {
        res.socio = trovati[0]; res.metodo = 'interno';
      } else if (trovati.length > 1) {
        res.candidati = trovati;
        res.avvisi.push('Gli interni indicati (' + interniTrovati.join(', ') + ') corrispondono a piu\' soci: scegli quello giusto.');
      } else {
        res.avvisi.push('Interno ' + interniTrovati.join(', ') + ' non presente nell\'elenco soci.');
      }
    }

    // 2) per nome
    function punteggi(testo) {

      if (p.length) { perNome = p.map(function (x) { return x.socio; }); return true; }

    });

      var parz = punteggi(testoNome || testoCompleto || '').filter(function (x) { return x.score >= 0.5 && x.hit >= 1; })
        .sort(function (a, b) { return b.score - a.score; }).slice(0, 5);
      if (!res.socio && !res.candidati.length) res.candidati = parz.map(function (x) { return x.socio; });
    }

    if (res.socio) {
      if (perNome.length && perNome.indexOf(res.socio) < 0 && perNome.length === 1) {
        res.avvisi.push('Attenzione: l\'interno indica ' + res.socio.nome + ' ma il nome sulla distinta sembra ' + perNome[0].nome + '. Controlla.');
      }
    } else if (!res.candidati.length || perNome.length) {
      if (perNome.length === 1) { res.socio = perNome[0]; res.metodo = 'nome'; }
      else if (perNome.length > 1) {
        res.candidati = perNome;
        res.avvisi.push('Piu\' soci con lo stesso nome: scegli quello giusto (conviene scrivere l\'interno nella causale).');

  }

  // ------------------------------------------------------------------ tutto insieme
  function analizza(testo, soci, opzioni) {

    var data = trovaData(testo);

    var causale = trovaCausale(testo);
    var ordinante = trovaOrdinante(testo);
    var interni = trovaInterni(causale || '');
    if (!interni.length) interni = trovaInterni(testo);
    var nomeTesto = ordinante || '';
    var senzaBenef = testo.split('\n').filter(function (l) { return RE_ETICH_BENEF.test(l) || !/beneficiario|a favore di|golfo dei fenici|iban|c\/c/i.test(l); }).join('\n') + '\n' + causale;
    var socio = (soci && soci.length) ? abbinaSocio(interni, nomeTesto, senzaBenef, soci) : { socio: null, candidati: [], avvisi: [], metodo: null };

  var API = {
    parseImporto: parseImporto, trovaImporti: trovaImporti, trovaData: trovaData, trovaCausale: trovaCausale,

  // ---------------------------------------------------------------- letture dei contatori

  function sceltaInterno(tipo) {

  function vistaFotoLettura(tipo, interno) {
    svuota(app);
    app.appendChild(indietro(vistaLettura));
    var fCam = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'hide', onchange: function () { if (fCam.files[0]) fotoScelta(tipo, interno, fCam.files[0]); } });

  function vistaValoreLettura(tipo, interno, foto) {
    svuota(app);
    app.appendChild(indietro(function () { vistaFotoLettura(tipo, interno); }));
    var unita = UNITA[tipo], letto = '';
    var card = h('div', { class: 'card' }, [h('h2', { text: NOME_TIPO[tipo] + ' – Int. ' + interno })]);
    var inp = h('input', { type: 'text', inputmode: 'decimal', class: 'val', placeholder: '0', autocomplete: 'off' });
    var alt = h('div', { class: 'chips' }), stato2 = h('p', { class: 'mut' }), esito = h('div'), rit = null;
    if (foto) {
      card.appendChild(h('p', { class: 'mut', text: 'Trascina il dito sulla foto per riquadrare solo i numeri, poi controlla il valore qui sotto.' }));
      var box = h('div', { class: 'ritaglio' });
      card.appendChild(box);
      rit = window.Contatori.Ritaglio(box, foto.canvas, leggiOra);
      card.appendChild(h('button', { type: 'button', style: 'margin-top:10px', text: '🔍 Rileggi i numeri nel riquadro', onclick: leggiOra }));
      card.appendChild(stato2);
    }
    card.appendChild(h('label', { text: 'Lettura del contatore (' + unita + ')' }));
    card.appendChild(h('div', { class: 'val-wrap' }, [inp, h('span', { class: 'val-unita', text: unita })]));
    card.appendChild(alt);
    card.appendChild(h('p', { class: 'mut', text: 'Controlla che il numero sia uguale a quello del contatore; se non lo è, correggilo.' }));
    var btn = h('button', { class: 'pri big', type: 'button', text: 'Invia la lettura', onclick: invia });
    card.appendChild(esito); card.appendChild(btn);
    app.appendChild(card);
    if (!foto) setTimeout(function () { inp.focus(); }, 50);

    function scriviStato(t, gira) { svuota(stato2); if (gira) stato2.appendChild(h('span', { class: 'spin' })); stato2.appendChild(document.createTextNode(t)); }
    function leggiOra() {
      if (!rit) return;
      scriviStato('Leggo i numeri…', true);
      window.Contatori.leggi(foto.canvas, rit.riquadro(), tipo, function (t) { scriviStato(t, true); }).then(function (r) {
        svuota(alt);
        if (r.migliore) { inp.value = r.migliore; letto = r.migliore; scriviStato('Numeri letti dalla foto: controllali bene.'); }
        else scriviStato('Non riesco a leggere i numeri: riquadrali meglio oppure scrivili a mano.');
        r.alternative.forEach(function (a) {
          alt.appendChild(h('button', { type: 'button', class: 'chip', text: 'Oppure ' + a + '?', onclick: function () { inp.value = a; letto = a; } }));
        });
      }).catch(function () { scriviStato('Lettura automatica non disponibile: scrivi il numero a mano.'); });
    }
    if (foto) setTimeout(leggiOra, 80);

    function invia() {
      svuota(esito);
      var v = String(inp.value).trim().replace(/\s/g, '').replace(',', '.');
      if (!/^\d+(\.\d{1,3})?$/.test(v)) { esito.appendChild(msg('err', 'Scrivi la lettura usando solo le cifre.')); return; }
      btn.disabled = true; btn.textContent = 'Invio in corso…';
      chiama({ azione: 'lettura', interno: interno, tipo: tipo, valore: v, ocr: !!letto && inp.value === letto,
        foto_base64: foto ? foto.base64 : '', foto_mime: foto ? foto.mime : '', foto_nome: 'contatore.jpg' }).then(function (j) {
        btn.disabled = false; btn.textContent = 'Invia la lettura';
        if (j.ok) return vistaLetturaOk(j, interno);
        esito.appendChild(msg('err', j.errore || 'Errore sconosciuto.'));
      }).catch(function () {
        btn.disabled = false; btn.textContent = 'Invia la lettura';
        esito.appendChild(msg('err', 'Invio non riuscito: controlla la connessione e riprova.'));
      });
    }
  }

  function numIt(n, dec) { return Number(n).toLocaleString('it-IT', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec === undefined ? 2 : dec }); }

  function vistaLetturaOk(j, interno) {

    if (j.consumo !== undefined) {
      card.appendChild(h('p', { text: 'Dall\'ultima lettura (' + numIt(j.precedente.valore) + ' del ' + j.precedente.data + ') hai consumato ' + numIt(j.consumo) + ' ' + j.unita + '.' }));
      card.appendChild(h('p', {}, ['Costo indicativo: ', h('strong', { text: 'circa € ' + numIt(j.stima, 2) }),
        ' (prezzo attuale € ' + numIt(j.prezzo, 2) + '/' + j.unita + ', IVA compresa).']));
      if (j.insolita) card.appendChild(msg('warn', 'Il consumo sembra alto: se il numero è giusto va bene, il direttivo controllerà.'));
    } else card.appendChild(h('p', { text: 'È la prima lettura registrata per questo contatore.' }));
    card.appendChild(h('p', { class: 'mut', text: 'Il direttivo verificherà la lettura: l\'importo definitivo comparirà nella tua situazione.' }));
    card.appendChild(h('button', { class: 'pri big', type: 'button', text: 'Inserisci un\'altra lettura', onclick: vistaLettura }));
    card.appendChild(h('button', { class: 'big', type: 'button', text: 'Torna all\'inizio', onclick: vistaInizio }));
    app.appendChild(card);

  // ---------------------------------------------------------------- la mia situazione
  function vistaSituazione(interno) {
    if (!interno && socio.interni.length > 1) {
      svuota(app);
      app.appendChild(indietro());
      var card = h('div', { class: 'card' }, [h('h2', { text: 'Quale interno?' })]);
      socio.interni.forEach(function (n) { card.appendChild(h('button', { type: 'button', class: 'big', text: 'Interno ' + n, onclick: function () { vistaSituazione(n); } })); });
      return app.appendChild(card);
    }
    interno = interno || socio.interni[0];
    var codici = leggi('distinte_codici') || {};
    if (!codici[interno]) return chiediCodice(interno);
    svuota(app);
    app.appendChild(indietro());
    app.appendChild(caricamento('Carico la tua situazione…'));
    chiama({ azione: 'situazione', interno: interno, codice: codici[interno] }).then(function (j) {
      if (j.ok) return mostraSituazione(j);
      if (j.codice) { delete codici[interno]; scrivi('distinte_codici', codici); return chiediCodice(interno, j.errore); }
      svuota(app); app.appendChild(indietro());
      app.appendChild(h('div', { class: 'card' }, [msg('warn', j.errore || 'Situazione non disponibile.')]));
    }).catch(function () {
      svuota(app); app.appendChild(indietro());
      app.appendChild(h('div', { class: 'card' }, [msg('err', 'Connessione non riuscita: riprova.')]));
    });
  }

  function chiediCodice(interno, errore) {
    svuota(app);
    app.appendChild(indietro());
    var inp = h('input', { type: 'text', inputmode: 'numeric', class: 'val', maxlength: '5', placeholder: '•••••', autocomplete: 'off' });
    var esito = h('div');
    if (errore) esito.appendChild(msg('err', errore));
    function vai() {
      var c = String(inp.value).replace(/\D/g, '');
      if (c.length !== 5) { svuota(esito); esito.appendChild(msg('err', 'Il codice ha 5 cifre.')); return; }
      var codici = leggi('distinte_codici') || {}; codici[interno] = c; scrivi('distinte_codici', codici);
      vistaSituazione(interno);
    }
    app.appendChild(h('div', { class: 'card' }, [
      h('h2', { text: 'La mia situazione – Int. ' + interno }),
      h('p', { class: 'mut', text: 'Per vedere i tuoi importi serve il codice personale di 5 cifre che ti ha dato il direttivo. Lo chiedo solo la prima volta su questo telefono.' }),
      h('label', { text: 'Codice personale' }), inp, esito,
      h('button', { class: 'pri big', type: 'button', style: 'margin-top:12px', text: 'Continua', onclick: vai })
    ]));
    setTimeout(function () { inp.focus(); }, 50);
  }

  var STATI = { 'in pari': 'ok', 'credito': 'ok', 'acconto': 'warn', 'da pagare': 'err', 'nessun addebito': '', 'da verificare': 'warn' };

  function riga(nome, valore, classe) { return h('tr', { class: classe || '' }, [h('td', { text: nome }), h('td', { text: valore })]); }

  function vistaStorico(interno) {
    var codici = leggi('distinte_codici') || {};
    svuota(app);
    app.appendChild(indietro(function () { vistaSituazione(interno); }));
    app.appendChild(caricamento('Carico lo storico…'));
    chiama({ azione: 'storico', interno: interno, codice: codici[interno] }).then(function (j) {
      svuota(app); app.appendChild(indietro(function () { vistaSituazione(interno); }));
      if (!j.ok) { app.appendChild(h('div', { class: 'card' }, [msg('warn', j.errore || 'Storico non disponibile.')])); return; }
      app.appendChild(h('p', { class: 'mut', style: 'margin:0 0 10px', text: j.socio + ' — Interno ' + j.interno }));
      if (!j.letture.length) { app.appendChild(h('div', { class: 'card' }, [h('p', { class: 'mut', text: 'Non ci sono ancora letture per il tuo interno.' })])); return; }
      if (j.anni.length) {
        var ta = h('table', { class: 'sit' }, [h('tr', {}, [h('td', {}, [h('b', { text: 'Anno' })]), h('td', {}, [h('b', { text: '💧 m³' })]), h('td', {}, [h('b', { text: '⚡ kWh' })])])]);
        j.anni.forEach(function (a) { ta.appendChild(h('tr', {}, [h('td', { text: String(a.anno) }), h('td', { text: a.acqua ? numIt(a.acqua) : '–' }), h('td', { text: a.luce ? numIt(a.luce) : '–' })])); });
        app.appendChild(h('div', { class: 'card' }, [h('h2', { text: 'Consumi per anno' }), ta,
          h('p', { class: 'mut', text: 'Consumo tra una lettura e la successiva, conteggiato nell\'anno della lettura più recente. Gli anni con poche letture possono risultare parziali.' })]));
      }
      var tl = h('table', { class: 'sit' }, [h('tr', {}, [h('td', {}, [h('b', { text: 'Data' })]), h('td', {}, [h('b', { text: '💧 Acqua' })]), h('td', {}, [h('b', { text: '⚡ Luce' })])])]);
      function cella(val, cons, unita) {

        var t = numIt(val);
        if (typeof cons === 'number') t += '\n(+' + numIt(cons) + ' ' + unita + ')';

          h('td', { style: 'white-space:pre-line', text: cella(x.luce, x.consLuce, 'kWh') })
        ]));
      });
      app.appendChild(h('div', { class: 'card' }, [h('h2', { text: 'Tutte le letture' }), tl,
        h('p', { class: 'mut', text: 'Tra parentesi il consumo dalla lettura precedente. 📜 = lettura degli anni passati inserita dal direttivo (solo informativa). ⏳ = in verifica.' })]));
    }).catch(function () {
      svuota(app); app.appendChild(indietro(function () { vistaSituazione(interno); }));
      app.appendChild(h('div', { class: 'card' }, [msg('err', 'Connessione non riuscita: riprova.')]));

  function mostraSituazione(j) {
    svuota(app);

      if (u.stato === 'da verificare') cu.appendChild(h('p', { class: 'mut', text: 'Una delle tue letture è in verifica da parte del direttivo.' }));
    } else {
      cu.appendChild(h('p', { class: 'mut', text: 'Per ora non ci sono addebiti di utenze.' }));
      var LL = j.letture || {};
      if (LL.acqua || LL.luce) cu.appendChild(h('p', { class: 'mut', text: 'Il costo si calcola sul consumo, cioè sulla differenza tra due letture: con la tua prossima lettura vedrai quanto hai consumato e quanto costa.' }));
    }
    if (j.prezzi && (j.prezzi.acqua || j.prezzi.luce)) {
      var tp = h('table', { class: 'sit', style: 'margin-top:10px' });
      if (j.prezzi.acqua) tp.appendChild(riga('💧 Prezzo acqua', '€ ' + numIt(j.prezzi.acqua, 2) + ' al m³'));
      if (j.prezzi.luce) tp.appendChild(riga('⚡ Prezzo luce', '€ ' + numIt(j.prezzi.luce, 3) + ' al kWh'));
      cu.appendChild(tp);
      cu.appendChild(h('p', { class: 'mut', style: 'margin:6px 0 0', text: 'Prezzi medi delle bollette degli ultimi 12 mesi, tutto compreso (IVA, oneri, quote fisse). Esempio: 10 m³ di acqua = € ' + numIt(10 * (j.prezzi.acqua || 0), 2) + ', 100 kWh di luce = € ' + numIt(100 * (j.prezzi.luce || 0), 2) + '.' }));
    }
    app.appendChild(cu);

    if (j.quote) {
      var q = j.quote, griglia = h('div', { class: 'mesi-q' });
      q.mesi.forEach(function (m) {
        griglia.appendChild(h('div', { class: 'mq' + (m.importo > 0 ? ' pag' : '') }, [m.mese, h('b', { text: m.importo > 0 ? '€ ' + numIt(m.importo, 0) : '–' })]));
      });
      var diff = Number(q.differenza) || 0, resto = Number(q.restoAnno) || 0;
      var oggiQ = q.dovutoOggi !== undefined ? Number(q.dovutoOggi) || 0 : Number(q.dovuto) || 0;
      var tq = h('table', { class: 'sit', style: 'margin-top:10px' }, [
        riga('Quota annuale', '€ ' + numIt(q.dovuto, 2)),
        riga('Dovuta ad oggi (mesi già scaduti)', '€ ' + numIt(oggiQ, 2)),
        riga('Quote versate', '€ ' + numIt(q.pagato, 2)),
        riga(diff < -0.5 ? 'In ritardo' : diff > 0.5 ? 'Versato in anticipo' : 'In regola', diff < -0.5 || diff > 0.5 ? '€ ' + numIt(Math.abs(diff), 2) : '✓', 'tot')
      ]);
      var prec = Number(q.anniPrecedenti) || 0;

      if (Number(A.perVecchioSocio) > 0.005) ta.appendChild(riga('Versato per il debito del vecchio socio', '€ ' + numIt(A.perVecchioSocio, 2)));
      ta.appendChild(riga(sar > 0.5 ? 'Da versare' : sar < -0.5 ? 'A tuo credito' : 'Saldato', sar > 0.5 || sar < -0.5 ? '€ ' + numIt(Math.abs(sar), 2) : '✓', 'tot'));
      app.appendChild(h('div', { class: 'card' }, [h('h2', { text: 'Arretrati anni precedenti' }),
        h('p', { class: 'mut', style: 'margin-top:0', text: 'Importi non pagati negli anni passati per questo interno. Per pagarli usa la causale "Arretrati".' }), ta]));
    }

    if (j.straordinarie) {
      var S = j.straordinarie, sa = Number(S.saldo) || 0;
      var ts = h('table', { class: 'sit' });
      S.voci.forEach(function (x) { ts.appendChild(riga(x.descrizione + ' (' + x.data + ')', '€ ' + numIt(x.quota, 2))); });
      ts.appendChild(riga('Già versato', '€ ' + numIt(S.versato, 2)));
      ts.appendChild(riga(sa > 0.5 ? 'Da versare' : sa < -0.5 ? 'A tuo credito' : 'Saldo', '€ ' + numIt(Math.abs(sa), 2), 'tot'));
      app.appendChild(h('div', { class: 'card' }, [h('h2', { text: 'Spese straordinarie' }),
        h('p', { class: 'mut', style: 'margin-top:0', text: 'Spese divise in parti uguali tra tutti gli interni. Per pagarle usa la causale "Spese extra".' }), ts]));

    var L = j.letture || {}, cl = h('div', { class: 'card' }, [h('h2', { text: 'Ultime letture' })]);
    cl.appendChild(h('table', { class: 'sit' }, [
      riga('💧 Acqua', L.acqua ? numIt(L.acqua.valore) + ' m³ – ' + L.acqua.data : 'nessuna'),
      riga('⚡ Luce', L.luce ? numIt(L.luce.valore) + ' kWh – ' + L.luce.data : 'nessuna')
    ]));
    cl.appendChild(h('button', { class: 'big', type: 'button', style: 'margin-top:12px', text: '🔢 Inserisci una nuova lettura', onclick: vistaLettura }));
    cl.appendChild(h('button', { class: 'big', type: 'button', style: 'margin-top:8px', text: '📈 Storico letture e consumi', onclick: function () { vistaStorico(j.interno); } }));
    app.appendChild(cl);
    if (j.aggiornato) app.appendChild(h('p', { class: 'mut', style: 'text-align:center', text: 'Importi aggiornati al ' + j.aggiornato }));
  }

  // ---------------------------------------------------------------- lettura file
  function scelto(file) {
    if (!file) return;
    if (file.size > MAX_BYTE) { alert('File troppo grande (massimo 12 MB).'); return; }
    var info = h('div', { class: 'card' }, [h('p', {}, [h('span', { class: 'spin' }), 'Sto leggendo la distinta…'])]);
    var barra = h('p', { class: 'mut', text: '' });
    info.appendChild(barra);
    svuota(app); app.appendChild(info);
    leggiFile(file, function (t) { barra.textContent = t; }).then(function (r) {
      elabora(r.testo, r.fileInfo, r.anteprimaUrl);
    }).catch(function (e) {
      svuota(app);
      app.appendChild(h('div', { class: 'card' }, [
        msg('warn', 'Non sono riuscito a leggere automaticamente il file (' + e.message + '). Puoi comunque compilare i dati a mano.'),
        h('button', { class: 'pri', type: 'button', text: 'Compila a mano', onclick: function () { preparaInvio(file).then(function (fi) { elabora('', fi.fileInfo, fi.anteprimaUrl); }); } }),
        h('button', { type: 'button', text: 'Annulla', onclick: vistaInizio })
      ]));
    });
  }

  function leggiComeBase64(blob) {
    return new Promise(function (ok, ko) {
      var fr = new FileReader();
      fr.onload = function () { ok(String(fr.result).split(',')[1] || ''); };
      fr.onerror = function () { ko(new Error('lettura file')); };
      fr.readAsDataURL(blob);
    });
  }

  function caricaImmagine(file) {
    return new Promise(function (ok, ko) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { ok({ img: img, url: url }); };
      img.onerror = function () { ko(new Error('immagine non leggibile')); };
      img.src = url;
    });
  }

  function disegna(img, latoMax, grigio) {
    var w = img.naturalWidth || img.width, hh = img.naturalHeight || img.height;
    var sc = latoMax / Math.max(w, hh);
    var c = document.createElement('canvas');
    c.width = Math.round(w * sc); c.height = Math.round(hh * sc);
    var ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, c.width, c.height);
    if (grigio) {
      var d = ctx.getImageData(0, 0, c.width, c.height), p = d.data, min = 255, max = 0, i, g;
      for (i = 0; i < p.length; i += 4) { g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; p[i] = g; if (g < min) min = g; if (g > max) max = g; }
      var range = Math.max(1, max - min);
      for (i = 0; i < p.length; i += 4) { g = (p[i] - min) * 255 / range; p[i] = p[i + 1] = p[i + 2] = g; }
      ctx.putImageData(d, 0, 0);
    }
    return c;
  }

  // prepara il file da inviare (immagini compresse, PDF cosi' com'e')
  function preparaInvio(file) {
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      return leggiComeBase64(file).then(function (b64) {
        return { fileInfo: { nome: file.name || 'distinta.pdf', mime: 'application/pdf', base64: b64 }, anteprimaUrl: null };
      });
    }
    return caricaImmagine(file).then(function (r) {
      var c = disegna(r.img, Math.min(1800, Math.max(r.img.naturalWidth, r.img.naturalHeight)), false);
      var dataUrl = c.toDataURL('image/jpeg', 0.82);
      return { fileInfo: { nome: (file.name || 'distinta').replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', base64: dataUrl.split(',')[1] }, anteprimaUrl: r.url };
    });
  }

  function ocr(canvas, stDett) {
    return caricaScript(TESS_URL).then(function () {
      stDett('Preparo il lettore di testo (la prima volta richiede qualche secondo)…');
      return window.Tesseract.createWorker('ita', 1, {
        logger: function (m) { if (m.status === 'recognizing text') stDett('Lettura in corso… ' + Math.round(m.progress * 100) + '%'); }
      });
    }).then(function (worker) {
      return worker.recognize(canvas).then(function (r) { return worker.terminate().then(function () { return r.data.text; }); });
    });
  }

  function leggiFile(file, stDett) {
    var eraPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    return preparaInvio(file).then(function (fi) {
      if (!eraPdf) {
        return caricaImmagine(file).then(function (r) {
          var lato = Math.max(r.img.naturalWidth, r.img.naturalHeight);
          var c = disegna(r.img, Math.max(1600, Math.min(2400, lato)), true);
          return ocr(c, stDett);
        }).then(function (testo) { return { testo: testo, fileInfo: fi.fileInfo, anteprimaUrl: fi.anteprimaUrl }; });
      }
      stDett('Leggo il PDF…');
      return caricaScript(PDFJS_URL).then(function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        return file.arrayBuffer();
      }).then(function (buf) {
        return window.pdfjsLib.getDocument({ data: buf }).promise;
      }).then(function (pdf) {
        var n = Math.min(pdf.numPages, 3), testo = '', p = Promise.resolve();
        for (var i = 1; i <= n; i++) (function (num) {
          p = p.then(function () { return pdf.getPage(num); }).then(function (pg) { return pg.getTextContent(); })
            .then(function (tc) {
              var riga = '', ultimaY = null;
              tc.items.forEach(function (it) {
                var y = it.transform[5];
                if (ultimaY !== null && Math.abs(y - ultimaY) > 2) { testo += riga + '\n'; riga = ''; }
                riga += it.str + ' '; ultimaY = y;
              });
              testo += riga + '\n';
            });
        })(i);
        return p.then(function () {
          if (testo.replace(/\s/g, '').length >= 40) return testo;
          stDett('PDF scansionato: lo converto in immagine e lo leggo…');
          return pdf.getPage(1).then(function (pg) {
            var vp = pg.getViewport({ scale: 2.2 });
            var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
            return pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise.then(function () { return ocr(c, stDett); });
          });
        });
      }).then(function (testo) { return { testo: testo, fileInfo: fi.fileInfo, anteprimaUrl: null }; });
    });
  }

  // ---------------------------------------------------------------- revisione
  function annoVista(mesi, def) { return mesi.length ? +mesi[0].slice(0, 4) : def; }

  function elabora(testo, fileInfo, anteprimaUrl) {
    var a = P.analizza(testo, [], { annoCorrente: new Date().getFullYear() });
    var avvisi = a.avvisi.slice();
    if (testo && socio) {
      var tokTesto = {};
      P.normNome(testo).forEach(function (x) { tokTesto[x] = 1; });
      var nomeTok = P.normNome(socio.nome);
      if (nomeTok.length && !nomeTok.some(function (x) { return tokTesto[x]; })) {
        avvisi.push('Il tuo nome non compare sulla distinta (va bene se ha pagato un familiare o un\'altra persona).');
      }
      if (a.interni.length && !a.interni.some(function (x) { return socio.interni.indexOf(x) >= 0; })) {
        avvisi.push('Sulla distinta è indicato l\'interno ' + a.interni.join(', ') + ', che non è tra i tuoi (' + socio.interni.join(', ') + '). Controlla.');
      }
    }
    stato = {
      testo: testo, fileInfo: fileInfo, anteprimaUrl: anteprimaUrl, analisi: a, avvisi: avvisi,
      data: a.data || '', totale: a.totale ? euro(a.totale) : '',
      ripartisci: !!socio && socio.interni.length > 1,
      voci: a.voci.map(function (v) {
        return { categoria: v.categoria, importo: v.importo ? euro(v.importo) : '', acconto: !!v.acconto, mesi: v.mesi.slice(), note: '', interno: socio.interni[0], annoVista: annoVista(v.mesi, a.anno || new Date().getFullYear()) };
      }),
      note: ''
    };
    if (!stato.voci.length) stato.voci.push({ categoria: 'Quota ordinaria', importo: '', acconto: false, mesi: [], note: '', interno: socio.interni[0], annoVista: a.anno || new Date().getFullYear() });
    // Causale mista (es. quota + utenze) senza importi separati: la quota si calcola dai mesi, il resto va all'altra voce
    if (a.voci.some(function (v) { return v.daDividere; }) && a.totale && stato.voci.length === 2) {
      var q = stato.voci.filter(function (v) { return v.categoria === 'Quota ordinaria'; })[0];
      var altra = stato.voci.filter(function (v) { return v !== q; })[0];
      var att = q ? attesoVoce(q) : 0;
      if (q && altra && att > 0 && att < a.totale) {
        q.importo = euro(att); altra.importo = euro(Math.round((a.totale - att) * 100) / 100);
        stato.avvisi = stato.avvisi.filter(function (t) { return t.indexOf('La causale comprende') !== 0; });
        stato.avvisi.push('Ho diviso il versamento: quota ' + q.mesi.length + (q.mesi.length === 1 ? ' mese' : ' mesi') + ' = € ' + q.importo +
          ', ' + altra.categoria.toLowerCase() + ' = € ' + altra.importo + '. Controlla e correggi se serve.');
      }
    }
    vistaRevisione();
  }

  function vistaRevisione() {
    svuota(app);
    var s = stato, a = s.analisi;
    s._info = [];
    var card = h('div', { class: 'card' });
    card.appendChild(h('h2', { text: 'Controlla i dati' }));
    card.appendChild(h('p', { class: 'mut', text: 'Versamento di ' + socio.nome + ' — ' + testoInterni(socio.interni) }));
    if (s.anteprimaUrl) card.appendChild(h('img', { class: 'anteprima', src: s.anteprimaUrl, alt: 'Anteprima della distinta' }));
    else card.appendChild(h('p', { class: 'mut', text: 'File: ' + s.fileInfo.nome }));
    s.avvisi.forEach(function (t) { card.appendChild(msg('warn', t)); });

    var inData = h('input', { type: 'date', value: s.data, onchange: function () { s.data = inData.value; } });
    card.appendChild(h('label', { text: 'Data del versamento' })); card.appendChild(inData);
    var quadr = h('div');
    var inTot = h('input', { type: 'text', inputmode: 'decimal', value: s.totale, oninput: function () { s.totale = inTot.value; aggiornaQuadratura(quadr); } });
    card.appendChild(h('label', { text: 'Importo totale della distinta (€)' })); card.appendChild(inTot);
    if (a.candidatiImporto && a.candidatiImporto.length > 1) {
      var ch = h('div', { class: 'chips' });
      a.candidatiImporto.slice(0, 6).forEach(function (v) {
        ch.appendChild(h('button', { class: 'chip', type: 'button', text: '€ ' + euro(v), onclick: function () { s.totale = euro(v); inTot.value = s.totale; aggiornaQuadratura(quadr); } }));
      });
      card.appendChild(h('div', { class: 'mut', text: 'Altri importi letti:', style: 'margin-top:6px' })); card.appendChild(ch);
    }
    if (a.causale) card.appendChild(h('p', { class: 'mut', text: 'Causale letta: ' + a.causale }));

    if (socio.interni.length > 1) {
      var ck = h('input', { type: 'checkbox', onchange: function () { s.ripartisci = ck.checked; vistaRevisione(); } }); ck.checked = s.ripartisci;
      card.appendChild(h('label', { style: 'display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:14px' }, [ck, 'Questo versamento copre tutti i miei interni (' + socio.interni.join(' e ') + '): dividi in parti uguali']));
    }

    card.appendChild(h('h2', { text: 'Cosa stai pagando', style: 'margin-top:16px' }));
    var vociBox = h('div');
    card.appendChild(vociBox);
    function disegnaVoci() {
      svuota(vociBox);
      s.voci.forEach(function (v, i) { vociBox.appendChild(cardVoce(v, i, quadr)); });
    }
    disegnaVoci();
    card.appendChild(h('button', { type: 'button', style: 'margin-top:10px', text: '+ Aggiungi una voce (es. quota + utenze)', onclick: function () {
      s.voci.push({ categoria: 'Utenze', importo: '', acconto: false, mesi: [], note: '', interno: socio.interni[0], annoVista: a.anno || new Date().getFullYear() });
      vistaRevisione();
    } }));
    card.appendChild(quadr);
    aggiornaQuadratura(quadr);

    var inNote = h('textarea', { placeholder: 'Facoltativo', oninput: function () { s.note = inNote.value; } }); inNote.value = s.note;
    card.appendChild(h('label', { text: 'Note' })); card.appendChild(inNote);

    var esito = h('div');
    var bSalva = h('button', { class: 'pri big', type: 'button', style: 'margin-top:14px', text: 'Invia la distinta', onclick: function () { salva(false, bSalva, esito); } });
    card.appendChild(esito); card.appendChild(bSalva);
    card.appendChild(h('button', { class: 'big', type: 'button', text: 'Annulla', onclick: vistaInizio }));
    app.appendChild(card);
  }

  function cardVoce(v, i, quadr) {
    var box = h('div', { class: 'voce' });
    var sel = h('select', { onchange: function () { v.categoria = sel.value; aggiornaInfoQuota(); } });
    CATEGORIE.forEach(function (c) { var o = h('option', { value: c, text: c }); if (c === v.categoria) o.selected = true; sel.appendChild(o); });
    box.appendChild(h('label', { text: 'Tipo' })); box.appendChild(sel);
    var unica = stato.voci.length === 1;
    if (!unica) {
      var imp = h('input', { type: 'text', inputmode: 'decimal', value: v.importo, oninput: function () { v.importo = imp.value; aggiornaQuadratura(quadr); } });
      box.appendChild(h('label', { text: 'Importo (€)' })); box.appendChild(imp);
    }
    if (socio.interni.length > 1 && !stato.ripartisci) {
      var si = h('select', { onchange: function () { v.interno = si.value; } });
      socio.interni.forEach(function (n) { var o = h('option', { value: n, text: 'Interno ' + n }); if (n === v.interno) o.selected = true; si.appendChild(o); });
      box.appendChild(h('label', { text: 'Per quale interno' })); box.appendChild(si);
    }
    var ckA = h('input', { type: 'checkbox', onchange: function () { v.acconto = ckA.checked; aggiornaInfoQuota(); } }); ckA.checked = !!v.acconto;
    box.appendChild(h('label', { style: 'display:flex;gap:8px;align-items:center;color:var(--tx)' }, [ckA, 'È un acconto']));

    box.appendChild(h('label', { text: 'Mesi a cui si riferisce' }));
    var griglia = h('div', { class: 'mesi' });
    var etAnno = h('strong', { text: String(v.annoVista) });
    var riepilogo = h('p', { class: 'mut', text: testoMesi(v.mesi) });
    function disegnaMesi() {
      svuota(griglia); etAnno.textContent = String(v.annoVista);
      P.MESI_BREVI.forEach(function (nome, k) {
        var chiave = v.annoVista + '-' + (k + 1 < 10 ? '0' : '') + (k + 1);
        griglia.appendChild(h('button', { type: 'button', class: v.mesi.indexOf(chiave) >= 0 ? 'on' : '', text: nome, onclick: function () {
          var p = v.mesi.indexOf(chiave);
          if (p >= 0) v.mesi.splice(p, 1); else { v.mesi.push(chiave); v.mesi.sort(); }
          disegnaMesi(); riepilogo.textContent = testoMesi(v.mesi); aggiornaInfoQuota();
        } }));
      });
    }
    box.appendChild(h('div', { class: 'anno' }, [
      h('button', { type: 'button', text: '‹', onclick: function () { v.annoVista--; disegnaMesi(); } }), etAnno,
      h('button', { type: 'button', text: '›', onclick: function () { v.annoVista++; disegnaMesi(); } })
    ]));
    box.appendChild(griglia); box.appendChild(riepilogo);
    var info = h('div');
    box.appendChild(info);
    stato._info.push({ v: v, el: info });
    disegnaMesi();

    var nt = h('input', { type: 'text', value: v.note, placeholder: 'Note sulla voce (facoltativo)', oninput: function () { v.note = nt.value; } });
    box.appendChild(nt);
    if (!unica) box.appendChild(h('button', { type: 'button', style: 'margin-top:8px', text: 'Rimuovi questa voce', onclick: function () { stato.voci.splice(i, 1); vistaRevisione(); } }));
    return box;
  }

  // Confronto tra importo della voce e quota prevista (es. 30 € al mese)
  function aggiornaInfoQuota() {
    if (!stato || !stato._info) return;
    var tot = numero(stato.totale);
    stato._info.forEach(function (x) {
      var v = x.v, el = x.el;
      svuota(el);
      if (v.categoria !== 'Quota ordinaria' || !v.mesi.length) return;
      var att = attesoVoce(v);
      var nInt = stato.ripartisci && socio.interni.length > 1 ? socio.interni.length : 1;
      var q0 = quotaMese(v.mesi[0]), uguali = v.mesi.every(function (m) { return quotaMese(m) === q0; });
      var spiega = 'Quota prevista: ' + (uguali ? v.mesi.length + (v.mesi.length === 1 ? ' mese' : ' mesi') + ' × € ' + euro(q0) : v.mesi.length + ' mesi') +
        (nInt > 1 ? ' × ' + nInt + ' interni' : '') + ' = € ' + euro(att);
      var imp = stato.voci.length === 1 ? tot : numero(v.importo);
      if (!isFinite(imp) || imp <= 0 || Math.abs(imp - att) < 0.009) { el.appendChild(msg(Math.abs(imp - att) < 0.009 ? 'ok' : '', spiega + (Math.abs(imp - att) < 0.009 ? ' ✓' : ''))); return; }
      if (imp < att) {
        el.appendChild(msg(v.acconto ? 'ok' : 'warn', spiega + '. L\'importo (€ ' + euro(imp) + ') è inferiore' +
          (v.acconto ? ': registrato come acconto.' : ': se è un pagamento parziale spunta "È un acconto", oppure controlla i mesi.')));
        return;
      }
      var resto = Math.round((imp - att) * 100) / 100;
      var box = msg('warn', spiega + '. L\'importo (€ ' + euro(imp) + ') è superiore di € ' + euro(resto) + ': se comprende anche utenze o spese extra, separale.');
      el.appendChild(box);
      if (stato.voci.length === 1) {
        ['Utenze', 'Spese extra'].forEach(function (cat) {
          el.appendChild(h('button', { type: 'button', style: 'margin:0 6px 6px 0', text: 'Separa € ' + euro(resto) + ' come ' + cat.toLowerCase(), onclick: function () {
            v.importo = euro(att);
            stato.voci.push({ categoria: cat, importo: euro(resto), acconto: false, mesi: [], note: '', interno: v.interno, annoVista: v.annoVista });
            vistaRevisione();
          } }));
        });
      }
    });
  }

  function testoMesi(mesi) {
    if (!mesi.length) return 'Nessun mese selezionato.';
    return 'Selezionati: ' + mesi.map(function (m) { return P.MESI_BREVI[+m.slice(5) - 1] + ' ' + m.slice(0, 4); }).join(', ');
  }

  function vociEffettive() {
    var tot = numero(stato.totale);
    if (stato.voci.length === 1) return [{ v: stato.voci[0], importo: tot }];
    return stato.voci.map(function (v) { return { v: v, importo: numero(v.importo) }; });
  }

  function aggiornaQuadratura(box) {
    aggiornaInfoQuota();
    svuota(box);
    var tot = numero(stato.totale);
    if (stato.voci.length < 2) return;
    var somma = vociEffettive().reduce(function (s, x) { return s + (isFinite(x.importo) ? x.importo : 0); }, 0);
    if (isFinite(tot) && Math.abs(somma - tot) < 0.009) box.appendChild(msg('ok', 'Quadra: voci € ' + euro(somma) + ' = totale € ' + euro(tot)));
    else box.appendChild(msg('warn', 'Le voci sommano € ' + euro(somma) + ' ma il totale è € ' + euro(tot) + '.'));
  }

  // Ripartizione in parti uguali (al centesimo) su tutti gli interni del socio
  function dividi(importo, n) {
    var cent = Math.round(importo * 100), base = Math.floor(cent / n), avanzo = cent - base * n, out = [];
    for (var i = 0; i < n; i++) out.push((base + (i === 0 ? avanzo : 0)) / 100);
    return out;
  }

  function vociPerInvio() {
    var out = [];
    vociEffettive().forEach(function (x) {
      if (stato.ripartisci && socio.interni.length > 1) {
        var parti = dividi(x.importo, socio.interni.length);
        socio.interni.forEach(function (n, k) {
          out.push({ interno: n, categoria: x.v.categoria, importo: parti[k], mesi: x.v.mesi, acconto: !!x.v.acconto, note: x.v.note });
        });
      } else {
        out.push({ interno: x.v.interno, categoria: x.v.categoria, importo: x.importo, mesi: x.v.mesi, acconto: !!x.v.acconto, note: x.v.note });
      }
    });
    return out;
  }

  // ---------------------------------------------------------------- salvataggio
  function validaStato() {
    var s = stato, errori = [];
    var tot = numero(s.totale);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s.data)) errori.push('Scegli la data del versamento.');
    if (!isFinite(tot) || tot <= 0) errori.push('Importo totale non valido.');
    var somma = 0;
    vociEffettive().forEach(function (x, i) {
      if (!isFinite(x.importo) || x.importo <= 0) errori.push('Importo non valido nella voce ' + (i + 1) + '.'); else somma += x.importo;
    });
    if (isFinite(tot) && Math.abs(somma - tot) > 0.009) errori.push('Le voci non sommano al totale.');
    return errori;
  }

  function salva(forza, bottone, esito) {
    var errori = validaStato();
    svuota(esito);
    if (errori.length) { errori.forEach(function (e) { esito.appendChild(msg('err', e)); }); return; }
    var s = stato, tot = numero(s.totale);
    var payload = {
      azione: 'salva', forza: !!forza, utente: socio.nome,
      file_nome: s.fileInfo.nome, file_mime: s.fileInfo.mime, file_base64: s.fileInfo.base64,
      versamento: { data: s.data, socio: socio.nome, importo_totale: tot, note: s.note, voci: vociPerInvio() }
    };
    bottone.disabled = true; bottone.textContent = 'Invio in corso…';
    chiama(payload).then(function (j) {
      bottone.disabled = false; bottone.textContent = 'Invia la distinta';
      if (j.ok) return vistaSuccesso();
      if (j.doppione) {
        if (window.confirm('Sembra che questa distinta sia già stata inviata (stessa data, interno e importo). Inviarla comunque?')) return salva(true, bottone, esito);
        return;
      }
      esito.appendChild(msg('err', j.errore || 'Errore sconosciuto.'));
    }).catch(function (e) {
      bottone.disabled = false; bottone.textContent = 'Invia la distinta';
      esito.appendChild(msg('err', 'Invio non riuscito: ' + e.message + ' Controlla la connessione e riprova (i dati sono ancora qui).'));
    });
  }

  function vistaSuccesso() {
    svuota(app);
    var ok = h('div', { class: 'cerchio-ok' });
    ok.innerHTML = '<svg viewBox="0 0 40 40"><path d="M10 21 L17 28 L30 13"/></svg>';
    app.appendChild(h('div', { class: 'card successo' }, [
      ok,
      h('h2', { text: 'Distinta ricevuta, grazie!' }),
      h('p', { text: 'Conserva la tua distinta originale: serve in caso di verifica.' }),
      h('button', { class: 'pri big', type: 'button', text: 'Carica un\'altra distinta', onclick: vistaDistinta }),
      h('button', { class: 'big', type: 'button', text: 'Torna all\'inizio', onclick: vistaInizio })
    ]));
  }

  // ---------------------------------------------------------------- avvio
  var btnImp = document.getElementById('btnImpost');
  btnImp.addEventListener('click', vistaImpostazioni);
  if (!DIRETTIVO) btnImp.classList.add('hide');
  window.__App = {
    elabora: elabora, stato: function () { return stato; },
    socio: function (s) { if (s !== undefined) socio = s; return socio; },
    cfg: function (c) { if (c) cfg = c; return cfg; }, avvia: vistaInizio, salva: salva,
    lettura: vistaValoreLettura, situazione: vistaSituazione
  };
  if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) document.getElementById('istruzioniHome').classList.add('hide');
  leggiLink();
  vistaInizio();
})();

</script>
